name: Generar APK DRUGO HTML TO VIDEO

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drugo-html-to-video-apk
  cancel-in-progress: false

jobs:
  apk:
    name: Compilar y publicar APK manualmente
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK (sin action externa)
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9 sin cache en Actions
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --no-build-cache
      - name: Publicar APK en GitHub Releases (sin artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk Drugo-HTML-To-Video.apk
          test -s Drugo-HTML-To-Video.apk
          sha256sum Drugo-HTML-To-Video.apk > Drugo-HTML-To-Video.apk.sha256
          TAG="android-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" Drugo-HTML-To-Video.apk Drugo-HTML-To-Video.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DRUGO HTML TO VIDEO ${GITHUB_RUN_NUMBER}" \
            --notes "APK de prueba generado manualmente. No se utilizan artifacts de GitHub Actions. El motor de exportación está en validación." \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
