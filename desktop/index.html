<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRUGO HTML TO VIDEO</title><style>body{background:#101726;color:#e9eefb;font:15px system-ui;margin:0;padding:24px}h1{margin:0 0 6px}.sub{color:#a8b5cf}.panel{background:#1b2740;padding:20px;border-radius:12px;max-width:800px;margin:22px auto}button{background:#3977f6;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer}button:disabled{opacity:.5}input,select{background:#111a2b;color:white;border:1px solid #52617e;padding:10px;border-radius:6px}label{display:inline-flex;gap:8px;align-items:center;margin:8px}#file{overflow-wrap:anywhere}progress{width:100%;height:18px}small{color:#a8b5cf}</style></head><body><main class="panel"><h1>DRUGO HTML TO VIDEO</h1><p class="sub">Windows · HTML a MP4 · sin servicios externos</p><button id="open">Seleccionar HTML</button><p id="file">Sin archivo</p><label>Duración (segundos) <input id="seconds" type="number" min="1" max="600" value="45"></label><label>Resolución <select id="resolution"><option value="1080">1080 × 1920</option><option value="720">720 × 1280</option></select></label><label>FPS <select id="fps"><option value="30">30</option><option value="24">24</option></select></label><p><button id="export" disabled>Exportar MP4</button></p><progress id="progress" value="0" max="100"></progress><p id="status">Selecciona un archivo HTML.</p><small>Primera versión experimental: necesita window.drugoRenderAt(ms) en el HTML para controlar el tiempo. No incluye audio. La velocidad dependerá del contenido y del equipo.</small></main><script>const {ipcRenderer}=require('electron');let file=null;const $=id=>document.getElementById(id);$('open').onclick=async()=>{file=await ipcRenderer.invoke('choose-html');$('file').textContent=file||'Sin archivo';$('export').disabled=!file};$('export').onclick=async()=>{if(!file)return;const seconds=Number($('seconds').value),height=Number($('resolution').value)===1080?1920:1280,width=height*9/16,fps=Number($('fps').value);$('export').disabled=true;$('progress').value=0;$('status').textContent='Preparando exportación...';try{const r=await ipcRenderer.invoke('export-video',{file,seconds,width,height,fps});$('status').textContent=r?'Guardado: '+r:'Exportación cancelada'}catch(e){$('status').textContent='Error: '+e.message}finally{$('export').disabled=false}};ipcRenderer.on('export-progress',(_,v)=>{$('progress').value=v.percent;$('status').textContent='Exportando '+v.frame+'/'+v.total+' fotogramas ('+v.percent+'%)'})</script></body></html>
