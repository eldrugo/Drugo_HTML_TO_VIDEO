name: Windows instalable y portable (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drugo-html-to-video-windows
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Crear instalador y portable
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publicar exclusivamente en Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-${{ github.run_id }}-${{ github.run_attempt }}"
          $files = @(Get-ChildItem -Path dist -Filter '*.exe' -File | ForEach-Object { $_.FullName })
          if ($files.Count -ne 2) { throw "Se esperaban instalador y portable; encontrados $($files.Count)" }
          gh release create $tag $files --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "DRUGO HTML TO VIDEO Windows ${{ github.run_number }}" --notes "Windows 11 x64: instalable y portable. Versión experimental, exportación sin audio. No se utilizan Actions Artifacts." --prerelease
