<!DOCTYPE html>
<html lang="es"><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;background:#07101f;color:white;font-family:sans-serif;overflow:hidden}
#sky{position:absolute;width:100%;height:100%} .caption{position:absolute;left:6%;right:6%;top:8%;text-align:center}
h1{font-size:24px;color:#67e8f9}p{font-size:16px;line-height:1.4}
</style></head><body><canvas id="sky"></canvas><div class="caption"><h1>DRUGO HTML TO VIDEO</h1><p id="message">Animación de prueba</p></div>
<script>
let canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');
let w=0,h=0;
function resize(){w=innerWidth;h=innerHeight;canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
onresize=resize;resize();
window.drugoRenderAt=function(t){
  ctx.fillStyle='#07101f';ctx.fillRect(0,0,w,h);
  for(let i=0;i<100;i++){let x=((i*117.37+t*0.018)%(w+40))-20,y=(i*79.91)%h;
    ctx.fillStyle='rgba(190,230,255,.7)';ctx.beginPath();ctx.arc(x,y,1.3,0,Math.PI*2);ctx.fill()}
  let x=w*(.1+.8*((t%45000)/45000)),y=h*.54+Math.sin(t*.001)*55;
  ctx.save();ctx.translate(x,y);ctx.fillStyle='#facc15';ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(-23,-13);ctx.lineTo(-18,0);ctx.lineTo(-23,13);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fb923c';ctx.beginPath();ctx.moveTo(-18,-7);ctx.lineTo(-48-Math.sin(t*.025)*18,0);ctx.lineTo(-18,7);ctx.fill();ctx.restore();
  document.getElementById('message').textContent='Tiempo: '+(t/1000).toFixed(2)+' segundos';
};
window.drugoRenderAt(0);
</script></body></html>
